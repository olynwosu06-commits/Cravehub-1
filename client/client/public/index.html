<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <title>CraveHub</title>
    <style>
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fcf9f8;
      }
      .initial-spinner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 4px solid rgba(183, 18, 42, 0.2);
        border-top-color: #b7122a;
        animation: initial-spin 0.7s linear infinite;
      }
      @keyframes initial-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script src="https://js.paystack.co/v1/inline.js"></script>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="initial-spinner"></div>
      </div>
    </div>
  </body>
</html>
